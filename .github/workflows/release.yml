name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev
      - name: Test
        run: make test
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          make clean && make VERSION="$version"
          name="livepulser-agent-${version}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          strip -o "dist/$name/livepulser-agent" build/livepulser-agent
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          cp packaging/systemd/livepulser-agent.service packaging/agent.conf.example "dist/$name/"
          cp third_party/cjson/LICENSE "dist/$name/LICENSE.cjson"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for details." *.tar.gz SHA256SUMS
